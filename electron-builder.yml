appId: com.videoai.desktop
productName: Video AI
copyright: © 2026 Video AI

directories:
  output: release
  buildResources: build

# Ship the compiled app (out/**) plus package.json. asar is DISABLED so the
# face-api model files (loaded via fetch) and the ffmpeg/ffprobe binaries are
# real on-disk files — fetch()/exec from inside an asar archive is unreliable.
asar: false
files:
  - out/**/*
  - package.json

# Bundle the MCP bridge script and skills so setup.ts can install them on first launch.
extraResources:
  - from: "resources/mcp-bridge.cjs"
    to: "mcp-bridge.cjs"
  - from: ".claude/skills"
    to: "skills"

# ---- macOS (.dmg, Apple Silicon + Intel) ----
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  artifactName: "Video-AI-${version}-mac-${arch}.${ext}"
  # Unsigned for now: allow the app to run (the website explains the first-open step).
  identity: null
dmg:
  title: "Video AI ${version}"

# ---- Windows (.exe NSIS installer) ----
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Video-AI-${version}-win-${arch}.${ext}"
# One-click installer so updates apply automatically (no wizard) and the app
# relaunches itself — matches the Mac auto-update UX. perMachine:false = per-user
# install, so no admin/UAC prompt (important since the app is unsigned).
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  artifactName: "Video-AI-${version}-win-x64-setup.${ext}"

# ---- Auto-update feed (electron-updater reads GitHub Releases) ----
publish:
  provider: github
  owner: atarantoandrea-png
  repo: video-ai
